{{ define "main" }}
{{ .Content }}

{{ $issues := where (where .Site.Pages "Section" "issues") "Kind" "section" }}
{{ $issues = where $issues "Params.cutoff" "!=" nil }}
{{ range $issues.ByParam "cutoff" }}
  <h2 class="headline"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <hr class="stars">
{{ end }}

<h2 class="headline">Next issue coming soon</h2>
{{ end }}
