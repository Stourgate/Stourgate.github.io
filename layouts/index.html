{{ define "main" }}
<h2 class="headline">Latest News</h2>
{{ range first 10 (where .Site.RegularPages "Type" "posts") }}
  {{ if .Params.image }}
    <img class="article-photo" src="{{ .RelPermalink }}{{ .Params.image }}" alt="{{ .Title }}">
  {{ else }}
    <div class="article-photo photo-placeholder">[ PHOTO ]</div>
  {{ end }}
  <h2 class="headline"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <div class="byline">Posted: {{ .Date.Format "2 January 2006" }}</div>
  <p>{{ .Summary }}</p>
  <hr class="stars">
{{ end }}
{{ end }}
